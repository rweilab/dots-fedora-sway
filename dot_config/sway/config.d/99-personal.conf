# Logo key. Use Mod1 for Alt.
set $mod Mod4

# Home row direction keys, like vim
set $left h
set $down j
set $up k
set $right l

# Your preferred terminal emulator
set $term foot
unbindsym $mod+Return
bindsym $mod+Return exec $term

# stop rofi using combined list
set $menu rofi -show drun -show-icons

    # Kill focused window
    bindsym $mod+q kill

    # Start your launcher
    unbindsym $mod+Space
    bindsym $mod+Space exec $menu

    # Reload the configuration file
    bindsym $mod+Shift+r reload

    # Basic alt-tab function
    bindsym Mod1+Tab focus next

    bindsym $mod+Ctrl+h resize shrink width 10px
    bindsym $mod+Ctrl+l resize grow width 10px
    bindsym $mod+Ctrl+j resize grow height 10px
    bindsym $mod+Ctrl+k resize shrink height 10px

# exec_always swaybg -i ~/Pictures/Cat_at_Play_4k.png -m fit
# Fedora calls output which can beat race conditions
# Best thing to do is to not even play and do the same to successfully override
    output * bg /usr/share/backgrounds/current-wallpaper fill
    exec brightnessctl set 100%

# Headless display customized for Samsung Tablet S7+
    output HEADLESS-1 {
      pos 1200,0
        mode 2800x1752
        scale 1.5
        bg /usr/share/backgrounds/current-wallpaper fill
    }

input * {
  repeat_rate 50
    repeat_delay 175
}

# Remove window title bar
default_border pixel 4
default_floating_border pixel 4
titlebar_padding 1
titlebar_border_thickness 0

assign [app_id="proton.vpn.app.gtk"] workspace 5
exec protonvpn-app

exec wl-paste --watch cliphist store
unbindsym $mod+v
# bindsym $mod+v exec sh -c "cliphist list | fuzzel | cliphist decode | wl-copy"
bindsym $mod+v exec sh -c "cliphist list | fuzzel --dmenu --lines 10 | cliphist decode | wl-copy"
