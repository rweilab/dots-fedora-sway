# ~/.config/foot/foot.ini

# Themes can override any settings in this file
# include=theme.ini

# hide_window_decorations=yes
# confirm_os_window_close=0

# custom
pad=2x2

# This is the configuration file for foot terminal
# For more information:
# https://codeberg.org/dnkl/foot

[main]

font=JetBrainsMono Nerd Font Mono:size=12
# font-bold=JetBrainsMono Nerd Font Mono ExtraBold:size=12
# font-italic=JetBrainsMono Nerd Font Mono:size=12
# font-bold-italic=JetBrainsMono Nerd Font Mono ExtraBold:size=12

# Uncomment for transparency
# alpha=0.90

# === Arthur Theme ===

[colors-dark]

background=1c1c1c
foreground=ddeedd

regular0=3d352a
regular1=cd5c5c
regular2=86af80
regular3=e8ae5b
regular4=6495ed
regular5=deb887
regular6=b0c4de
regular7=bbaa99

bright0=554444
bright1=cc5533
bright2=88aa22
bright3=ffa75d
bright4=87ceeb
bright5=996600
bright6=b0c4de
bright7=ddccbb

selection-background=4d4d4d
selection-foreground=1c1c1c

